name: Release

# Push a tag such as v1.0.0 to build self-contained packages for every platform and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtimes: win-x64,win-arm64
          - os: ubuntu-latest
            runtimes: linux-x64,linux-arm64
          - os: macos-latest
            runtimes: osx-x64,osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        shell: pwsh
        run: ./build.ps1 -Configuration Release -SkipLegacy

      - name: Package
        shell: pwsh
        run: ./build/publish.ps1 -Runtime ('${{ matrix.runtimes }}' -split ',') -Version ('${{ github.ref_name }}'.TrimStart('v'))

      # macOS: Gatekeeper blocks unsigned apps downloaded from the internet. Signing and notarisation
      # need an Apple Developer ID; add it as a secret and run codesign/notarytool here before release.

      - name: Rename checksums per runner
        shell: pwsh
        run: Move-Item artifacts/SHA256SUMS "artifacts/SHA256SUMS-${{ matrix.os }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS-*

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Combine checksums
        run: cat artifacts/SHA256SUMS-* > artifacts/SHA256SUMS 2>/dev/null || true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
