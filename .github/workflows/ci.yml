name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # On Windows this also builds FOCA Classic and its tests
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      # The build already fails on vulnerable packages (NuGetAudit as error); this records a report
      - name: Vulnerable package audit
        shell: pwsh
        run: |
          dotnet restore Foca.slnx
          dotnet list Foca.slnx package --vulnerable --include-transitive | Tee-Object audit.txt
          if (Select-String -Path audit.txt -Pattern '> .*\b(High|Critical|Moderate)\b' -Quiet) {
            Get-Content audit.txt
            throw 'Vulnerable packages found'
          }
